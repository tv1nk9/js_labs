<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoList</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

<!--   Экран 1: список задач -->
  <main class="screen" id="mainScreen">
    <div class="empty" id="emptyState">
      <svg width="180" height="160" viewBox="0 0 200 180" fill="none" aria-hidden="true">
        <rect x="56" y="24" width="88" height="130" rx="12" fill="#2A9D8F"/>
        <rect x="84" y="14" width="32" height="18" rx="6" fill="#9AA0A6"/>
        <rect x="67" y="38" width="66" height="102" rx="6" fill="#fff"/>
        <rect x="74" y="48" width="13" height="13" rx="3" fill="#fff" stroke="#C9CDD2" stroke-width="2"/>
        <path d="m76.5 54.5 3 3.5 6.5-8" stroke="#E63946" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="94" y="50" width="32" height="4" rx="2" fill="#DADDE0"/>
        <rect x="94" y="57" width="24" height="4" rx="2" fill="#E8EAED"/>
        <rect x="74" y="76" width="13" height="13" rx="3" fill="#fff" stroke="#C9CDD2" stroke-width="2"/>
        <rect x="94" y="78" width="32" height="4" rx="2" fill="#DADDE0"/>
        <rect x="94" y="85" width="24" height="4" rx="2" fill="#E8EAED"/>
        <rect x="74" y="104" width="13" height="13" rx="3" fill="#fff" stroke="#C9CDD2" stroke-width="2"/>
        <rect x="94" y="106" width="32" height="4" rx="2" fill="#DADDE0"/>
        <rect x="94" y="113" width="24" height="4" rx="2" fill="#E8EAED"/>
      </svg>
      <p>Add a task to get started</p>
    </div>
    <ul class="todo-list" id="todoList"></ul>
  </main>

<!--   Кнопка + -->
  <button class="fab" type="button" id="addBtn" title="Добавить задачу">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

<!--   Экран 2: ввод текста задачи / редактирование -->
  <section class="screen" id="modalScreen" hidden>
    <header class="modal-header">
      <button class="icon-action" type="button" id="backBtn" title="Назад">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F7B500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
      </button>
      <button class="icon-action" type="button" id="saveBtn" title="Сохранить">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F7B500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m4 12.5 5 5L20 6.5"/>
        </svg>
      </button>
    </header>
    <textarea id="taskInput" placeholder="Add New Task..."></textarea>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
