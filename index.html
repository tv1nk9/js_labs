<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">

    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff" aria-hidden="true">
          <rect x="0" y="7" width="3" height="4" rx="0.5"/>
          <rect x="4.5" y="5" width="3" height="6" rx="0.5"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="0.5"/>
          <rect x="13.5" y="0" width="3" height="11" rx="0.5"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff"
             stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M1.5 4.5a10.5 10.5 0 0 1 13 0"/>
          <path d="M4 7a7 7 0 0 1 8 0"/>
          <path d="M6.5 9.4a3.5 3.5 0 0 1 3 0"/>
          <circle cx="8" cy="11" r="1" fill="#fff" stroke="none"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
          <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" fill="none" stroke="#fff" opacity="0.5"/>
          <rect x="2" y="2" width="18" height="8" rx="1.5" fill="#fff"/>
          <path d="M23 4v4a2 2 0 0 0 0-4z" fill="#fff" opacity="0.5"/>
        </svg>
      </span>
    </div>

    <div class="display-wrap">
      <span id="memory-indicator" class="memory-indicator hidden">M</span>
      <div id="display" class="display" aria-live="polite">0</div>
    </div>

    <div class="buttons">
      <button class="btn btn-memory" data-action="m-plus">M+</button>
      <button class="btn btn-memory" data-action="m-minus">M-</button>
      <button class="btn btn-memory" data-action="m-read">MR</button>
      <button class="btn btn-memory" data-action="m-save">MS</button>

      <button class="btn btn-memory" data-action="clear">AC</button>
      <button class="btn btn-memory" data-action="m-clear">MC</button>
      <button class="btn btn-memory" data-action="percent">%</button>
      <button class="btn btn-operator" data-action="operator" data-op="/">÷</button>

      <button class="btn btn-digit" data-action="digit" data-digit="7">7</button>
      <button class="btn btn-digit" data-action="digit" data-digit="8">8</button>
      <button class="btn btn-digit" data-action="digit" data-digit="9">9</button>
      <button class="btn btn-operator" data-action="operator" data-op="*">×</button>

      <button class="btn btn-digit" data-action="digit" data-digit="4">4</button>
      <button class="btn btn-digit" data-action="digit" data-digit="5">5</button>
      <button class="btn btn-digit" data-action="digit" data-digit="6">6</button>
      <button class="btn btn-operator" data-action="operator" data-op="-">−</button>

      <button class="btn btn-digit" data-action="digit" data-digit="1">1</button>
      <button class="btn btn-digit" data-action="digit" data-digit="2">2</button>
      <button class="btn btn-digit" data-action="digit" data-digit="3">3</button>
      <button class="btn btn-operator" data-action="operator" data-op="+">+</button>

      <button class="btn btn-digit btn-zero" data-action="digit" data-digit="0">0</button>
      <button class="btn btn-digit" data-action="comma">,</button>
      <button class="btn btn-operator" data-action="equals">=</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
